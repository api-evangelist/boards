aid: boards
name: Boards
description: 'Boards is a mobile-first collaboration and duplication platform for network marketing
  and direct sales teams. It lets leaders turn what works for them into a simple, repeatable system
  that new team members can follow, sharing content, training, and workflows so a business can scale
  beyond its founder. The product centers on team alignment, faster onboarding of new members, and
  giving distributors a single place with everything they need to succeed, alongside a Success Academy
  for training and a brand and referral program. Boards is backed by Bessemer Venture Partners. It
  publishes no public API, developer portal, or SDKs; its surface is a consumer web and mobile app.'
